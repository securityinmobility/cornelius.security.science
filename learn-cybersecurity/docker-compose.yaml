services:
  learn-cybersecurity:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - web
    # nginx access log is disabled in nginx.conf; additionally keep Docker from
    # persisting any container output (error lines can contain client IPs).
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '0.1g'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.learn-cybersecurity.rule=Host(`learn.security.science`)"
      - "traefik.http.routers.learn-cybersecurity.entrypoints=https"
      - "traefik.http.routers.learn-cybersecurity.tls=true"
      - "traefik.http.routers.learn-cybersecurity.tls.certresolver=le"
      - "traefik.http.routers.learn-cybersecurity.middlewares=learn-cybersecurity-gzip"
      - "traefik.http.middlewares.learn-cybersecurity-gzip.compress=true"
      - "traefik.http.services.learn-cybersecurity.loadbalancer.server.port=80"

networks:
  web:
    external: true
