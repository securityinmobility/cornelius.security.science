# Local testing without Traefik: http://localhost:8080
#   docker compose -f docker-compose.local.yaml up -d
#   docker compose -f docker-compose.local.yaml down
# Phones in the same network can join via http://<your-computer-ip>:8080/phinder/
services:
  web:
    image: nginx:mainline-alpine
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - phinder

  phinder:
    image: node:22-alpine
    user: node
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - CARDS_PATH=/cards/cards.js
    volumes:
      - ./phinder-server:/app:ro
      - ./html/phinder:/cards:ro
    read_only: true
    networks:
      - phinder

networks:
  phinder:
    internal: true
