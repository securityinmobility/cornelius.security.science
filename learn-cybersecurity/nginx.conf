worker_processes 1;
pid /var/run/nginx.pid;

# Only log startup failures; no request data.
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Privacy: never write access logs (no IPs, no user agents, no URLs).
    access_log off;
    log_not_found off;

    server_tokens off;
    sendfile on;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Everything is self-contained: no third-party fonts, scripts or trackers.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # Browsers always check for a newer version (cheap: unchanged files answer 304).
        add_header Cache-Control "no-cache" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Phinder online rooms (separate Node container, see docker-compose.yaml).
        # Resolved at request time, so nginx still starts if that container is down.
        # No X-Forwarded-For: the game server never sees client IPs.
        location /api/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $phinder http://phinder:3000;
            proxy_pass $phinder;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            client_max_body_size 4k;
        }
    }
}
